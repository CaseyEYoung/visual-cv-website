<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Subtle mathematics background with matrix and vectors">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#edf3ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <g font-family="Consolas, monospace" font-size="30" fill="#5f80ab">
    <text x="80" y="120">[ 2  1  0 ]</text>
    <text x="80" y="160">[ 1  3  4 ]</text>
    <text x="80" y="200">[ 0  2  5 ]</text>
    <text x="410" y="160">×</text>
    <text x="470" y="120">[ x ]</text>
    <text x="470" y="160">[ y ]</text>
    <text x="470" y="200">[ z ]</text>
    <text x="620" y="160">=</text>
    <text x="690" y="120">[ 5 ]</text>
    <text x="690" y="160">[ 3 ]</text>
    <text x="690" y="200">[ 7 ]</text>
  </g>
  <g stroke="#8eafd8" stroke-width="4" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#8eafd8"/>
      </marker>
    </defs>
    <line x1="890" y1="300" x2="1080" y2="150"/>
    <line x1="890" y1="300" x2="980" y2="95"/>
    <line x1="890" y1="300" x2="1120" y2="295"/>
  </g>
  <text x="845" y="345" font-family="Arial, sans-serif" font-size="22" fill="#5f80ab">v = ai + bj + ck</text>
</svg>
